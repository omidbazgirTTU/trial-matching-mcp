<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Eligibility Signals</title>
    <style>
      body { font-family: system-ui, sans-serif; margin:0; padding:14px; background:#f8fafc; }
      .card { background:#fff; border-radius:12px; padding:16px; border:1px solid #e2e8f0; }
      h1 { margin:0 0 6px; font-size:16px; color:#0f172a; }
      .summary { font-size:13px; color:#475569; margin-bottom:10px; }
      ul { list-style:none; padding:0; margin:0; }
      li { border:1px solid #e5e7eb; border-radius:8px; padding:8px 10px; margin-bottom:6px; font-size:13px; }
      .type { font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:#64748b; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="title"></h1>
      <div id="summary" class="summary"></div>
      <ul id="signals"></ul>
      <pre id="raw" style="display:none;"></pre>
    </div>
    <script>
      window.renderEligibilityGaps = function (payload = {}) {
        document.getElementById("title").textContent = `${payload.patient_id || ''} vs ${payload.nct_id || ''}`;
        document.getElementById("summary").textContent = payload.summary || '';
        const list = document.getElementById("signals");
        list.innerHTML = "";
        (payload.signals || []).forEach(sig => {
          const li = document.createElement("li");
          li.innerHTML = `<div class="type">${sig.type || 'info'}</div><div>${sig.message || ''}</div>`;
          list.appendChild(li);
        });
      };
    </script>
  </body>
</html>
