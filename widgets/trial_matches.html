<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Trial Matches</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #f5f7fb; }
      h1 { font-size: 16px; margin: 0 0 8px; }
      .card { background: #fff; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; border: 1px solid #e5e9f2; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06); }
      .nct { font-size: 12px; letter-spacing: 0.05em; color: #64748b; }
      .title { margin: 4px 0 6px; font-size: 15px; color: #0f172a; }
      .meta { font-size: 12px; color: #475569; display: flex; gap: 12px; }
      .chips { margin-top: 8px; }
      .chip { display: inline-block; background: #eef2ff; color: #4338ca; padding: 2px 8px; border-radius: 999px; font-size: 11px; margin-right: 4px; }
    </style>
  </head>
  <body>
    <h1>Coordinator Trial Matches</h1>
    <div id="trial-matches"></div>
    <script>
      window.renderTrialMatches = function (matches = []) {
        const container = document.getElementById("trial-matches");
        container.innerHTML = "";
        matches.forEach((trial) => {
          const div = document.createElement("div");
          div.className = "card";
          const chips = (trial.mechanism || []).map((item) => `<span class="chip">${item}</span>`).join(" ");
          div.innerHTML = `
            <div class="nct">${trial.nct_id || "NCT ID"}</div>
            <div class="title">${trial.title || "Trial title"}</div>
            <div class="meta">
              <span>Status: ${trial.status || "?"}</span>
              <span>Phase: ${trial.phase || "?"}</span>
            </div>
            <div class="chips">${chips}</div>
          `;
          container.appendChild(div);
        });
      };
    </script>
  </body>
</html>
